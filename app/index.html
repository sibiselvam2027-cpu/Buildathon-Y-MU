<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5ef">
  <meta name="description" content="Find and reserve a parking spot around DLF Cyber City in the ParkEasy interactive demo.">
  <title>ParkEasy | Parking before you arrive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <header class="topbar">
    <div class="top-inner">
      <a class="brand" href="./" aria-label="ParkEasy home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M10 23V9h7a4.2 4.2 0 0 1 0 8.4h-7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23.5" cy="23" r="2" fill="currentColor"/></svg></span><span>ParkEasy</span></a>
      <nav class="top-nav" aria-label="Main navigation">
        <button class="nav-link selected" id="nav-explore"><span data-icon="map"></span><span>Explore</span></button>
        <button class="nav-link" id="nav-sessions"><span data-icon="ticket"></span><span>My parking</span><i class="nav-dot" id="nav-dot" hidden></i></button>
      </nav>
      <button class="demo-button" id="demo-info"><i></i><span>Demo mode</span><span class="info-icon" data-icon="info"></span></button>
    </div>
  </header>

  <main class="site-main">
    <div class="experience">
    <div class="workspace">
    <section class="intro" aria-labelledby="main-title">
      <p class="location-overline"><span data-icon="pin"></span> DLF CYBER CITY, GURUGRAM</p>
      <h1 id="main-title">Parking before <em>you arrive<span>.</span></em></h1>
      <p>Tell ParkEasy where you’re headed. See the best spot and book it in one tap.</p>
    </section>

    <section class="agent-hero" id="agent-hero" aria-labelledby="agent-heading">
      <div class="agent-heading"><span class="agent-mark" data-icon="sparkles"></span><h2 id="agent-heading">Ask ParkEasy</h2></div>
      <form class="agent-form" id="agent-form">
        <label for="agent-query" class="sr-only">Describe the parking you need</label>
        <div class="agent-entry">
          <input type="text" id="agent-query" name="request" maxlength="240" autocomplete="off" enterkeyhint="search" placeholder="Where do you need parking?">
          <button class="primary agent-submit" type="submit">Find my spot <span data-icon="arrow-right"></span></button>
        </div>
        <div class="agent-suggestion">
          <button type="button" data-action="example" data-example="Covered bike parking near CyberHub for 2 hours">Covered bike at CyberHub <span data-icon="arrow-right"></span></button>
          <button type="button" data-action="example" data-example="Cheapest car parking near Gateway Tower for 90 minutes">Budget car at Gateway <span data-icon="arrow-right"></span></button>
        </div>
      </form>
      <p id="agent-feedback" class="agent-feedback" role="status" hidden></p>
      <div id="agent-response" class="agent-response" aria-label="Parking recommendation" hidden></div>
    </section>

    <details class="manual-search">
      <summary>Search with filters <span data-icon="chevron"></span></summary>
    <form id="search-form" class="search-bar" aria-label="Find parking">
      <label class="search-field destination-field">
        <span class="field-icon" data-icon="pin"></span>
        <span class="field-body"><span class="field-label">Where to?</span><select id="destination" name="destination"></select></span>
        <span class="field-arrow" data-icon="chevron"></span>
      </label>
      <fieldset class="search-field vehicle-field">
        <legend class="sr-only">Vehicle</legend>
        <span class="field-icon" data-icon="car"></span>
        <div class="field-body"><span class="field-label">Vehicle</span><div class="vehicle-toggle"><label><input type="radio" name="vehicle" value="car" checked><span>Car</span></label><label><input type="radio" name="vehicle" value="bike"><span>Bike</span></label></div></div>
      </fieldset>
      <label class="search-field duration-field">
        <span class="field-icon" data-icon="clock"></span>
        <span class="field-body"><span class="field-label">Duration</span><select id="duration" name="duration"></select></span>
        <span class="field-arrow" data-icon="chevron"></span>
      </label>
      <button class="primary search-submit" type="submit">Find parking <span data-icon="arrow-right"></span></button>
    </form>
    </details>

    <div id="booking-banner" class="booking-banner" hidden></div>

      <section class="result-heading" aria-label="Parking results">
        <div class="result-title"><div><p class="result-kicker">NEAR <span id="result-area">DLF CYBERHUB</span></p><h2 id="result-count" aria-live="polite">Recommended spots</h2></div><label class="sort"><span class="sr-only">Sort spots</span><select id="sort"><option value="distance">Nearest</option><option value="price">Lowest price</option><option value="rating">Top rated</option></select><span data-icon="chevron"></span></label></div>
        <div id="type-filters" class="type-filters" aria-label="Parking type"></div>
        <div id="amenity-filter" hidden></div>
      </section>
      <div id="results" class="results" aria-label="Recommended parking spaces"></div>
    </div>

    <section class="map-stage" aria-label="Parking map and selected spot">
      <header class="map-heading"><span class="map-heading-icon" data-icon="map"></span><h2>Parking map</h2><span id="map-status" class="map-heading-status"></span></header>
      <div class="map-body">
        <section id="map" class="map-panel" aria-label="Bird’s-eye parking map of DLF Cyber City"></section>
        <aside id="map-spotlight" class="map-spotlight" aria-label="Selected parking spot"></aside>
      </div>
    </section>
    </div>
    <footer class="page-footer"><span>ParkEasy <b>·</b> Gurugram pilot</span><button class="text-button" id="footer-info">What’s simulated?</button></footer>
  </main>

  <dialog id="dialog" aria-labelledby="modal-title"><div id="dialog-content"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
